<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 376" role="img">
<title>explore-python environments on Python 3.15.2</title>
<desc>Python 3.15.2 feeds three environments: local macOS venv, Docker and the devcontainer. All three run the same hello_world app and tests.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px}
.th{font-size:14px;font-weight:500}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .th{fill:#3C3489}.p .ts{fill:#534AB7}
.t rect{fill:#E1F5EE;stroke:#0F6E56}.t .th{fill:#085041}.t .ts{fill:#0F6E56}
.g rect{fill:#F1EFE8;stroke:#5F5E5A}.g .th{fill:#444441}.g .ts{fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
#a path{stroke:#888780}
@media (prefers-color-scheme:dark){
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .th{fill:#CECBF6}.p .ts{fill:#AFA9EC}
.t rect{fill:#085041;stroke:#5DCAA5}.t .th{fill:#9FE1CB}.t .ts{fill:#5DCAA5}
.g rect{fill:#444441;stroke:#B4B2A9}.g .th{fill:#D3D1C7}.g .ts{fill:#B4B2A9}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="p"><rect x="230" y="30" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="49" text-anchor="middle" dominant-baseline="central">Python 3.15.2</text><text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">Latest 3.15.x</text></g>
<line x1="300" y1="86" x2="130" y2="146" class="arr" marker-end="url(#a)"/>
<line x1="340" y1="86" x2="340" y2="146" class="arr" marker-end="url(#a)"/>
