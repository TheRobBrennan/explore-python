<g class="t"><rect x="250" y="150" width="180" height="72" rx="8" stroke-width="0.5"/><text class="th" x="340" y="175" text-anchor="middle" dominant-baseline="central">Docker</text><text class="ts" x="340" y="197" text-anchor="middle" dominant-baseline="central">python:3.15.2-slim</text></g>
<g class="t"><rect x="460" y="150" width="180" height="72" rx="8" stroke-width="0.5"/><text class="th" x="550" y="175" text-anchor="middle" dominant-baseline="central">Devcontainer</text><text class="ts" x="550" y="197" text-anchor="middle" dominant-baseline="central">3.15-trixie + .venv</text></g>
